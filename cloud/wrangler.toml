# Jarvis on Cloudflare Workers. Netlify ignores this file and still uses netlify.toml.
#   npx wrangler dev       runs it locally, with secrets from .dev.vars
#   npx wrangler deploy    publishes it
name = "jarvis"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The phone app's files. /api/* reaches the Worker first; everything else is served as a file.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "1b57c7ec-e145-4ccc-9f61-f33ad933db95"

# The weather check, every hour.
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
