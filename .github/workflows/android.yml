# Builds the Android app, tries it on an emulator and publishes everything to the "apk-latest" release.
name: Android APK

on:
  push:
    branches: [claude/busy-ramanujan-6i9tbb, init-upload]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # Android only installs an update signed with the same key. Stop here rather than publish an APK
      # that couldn't update people's phones.
      - name: Load the signing key
        env:
          JARVIS_KEYSTORE: ${{ secrets.JARVIS_KEYSTORE }}
        run: |
          mkdir -p mobile/ci-out
          if [ -z "$JARVIS_KEYSTORE" ]; then
            echo "JARVIS_KEYSTORE secret is missing or empty" | tee mobile/ci-out/build.log
            exit 1
          fi
          echo "$JARVIS_KEYSTORE" | base64 -d > "$RUNNER_TEMP/jarvis.p12"
          echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: mobile
        env:
          JARVIS_BUILD: ${{ github.run_number }}
        run: |
          mkdir -p ci-out
          set -o pipefail
          npm ci 2>&1 | tee ci-out/build.log
          npx cap sync android 2>&1 | tee -a ci-out/build.log
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --no-daemon --stacktrace) 2>&1 | tee -a ci-out/build.log
          cp android/app/build/outputs/apk/debug/app-debug.apk ci-out/jarvis.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs ci-out/jarvis.apk | tee ci-out/signature.txt
          # What the app checks to see whether a newer build exists (one more than the build number, see build.gradle).
          echo "{\"versionCode\": $((JARVIS_BUILD + 1))}" > ci-out/version.json

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Try it on an emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash mobile/ci/smoke.sh

      - name: Publish
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Jarvis Android (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: "Built automatically from ${{ github.sha }}. Install jarvis.apk on your phone."
          files: mobile/ci-out/*
